version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pizza-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pizza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: pizza-node-api
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=pizza
      - DB_USER=postgres
      - DB_PASSWORD=password
      - NODE_ENV=development
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data:
